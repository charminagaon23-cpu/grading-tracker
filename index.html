<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grading Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#2f6f5e;--ac2:#e3f0ec;--bd:#e5e3dc;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1f2326;--tx:#e8eaeb;--mu:#9aa3a8;--ac:#5fb59f;--ac2:#23352f;--bd:#33393d;--bad:#ef7a6c}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1f2326;--tx:#e8eaeb;--mu:#9aa3a8;--ac:#5fb59f;--ac2:#23352f;--bd:#33393d;--bad:#ef7a6c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg button{padding:10px 4px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;flex:0 0 auto}
.ghost{background:none;color:var(--bad);border:1px solid var(--bd)}
.stu{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 label{margin:6px 0 2px;font-size:11px}.g5 input{padding:8px 4px;text-align:center}
.bad{border-color:var(--bad)}
.pod{display:flex;gap:8px}.pod div{flex:1;background:var(--ac2);border-radius:10px;padding:10px;text-align:center}
.pod b{display:block;font-size:22px}.pod small{color:var(--mu)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd)}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
.mu{color:var(--mu);font-size:13px}
.fi{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--mu);font-size:14px}.fb{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.mk{display:flex;align-items:center;gap:8px;margin:10px 0}
textarea{width:100%;height:80px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:12px monospace}.mk>div:first-child{flex:0 0 44%}.ar{color:var(--bad);font-weight:700;font-size:13px;line-height:1.3}

<script>
const KEY='gradetracker_v1',C=[['att','Attendance',.25],['gam','Games',.15],['mem','Memory Verse',.15],['act','Activity',.25],['rec','Recitation',.20]];
const blank=()=>({level:'',teacher:'',curr:'',n:5,students:[],lessons:{},nid:1}),LV=['Beginner','Primary','Intermediate'];let S=blank(),ALL={},RL='',tab='setup',cur=1,DB=null,uid=null,OWN={},timer=null;
try{const d=localStorage.getItem(KEY);if(d){const p=JSON.parse(d);if(p.all){ALL=p.all;S=Object.assign(blank(),p.S)}else S=Object.assign(S,p)}}catch(e){}
const myLevel=()=>Object.keys(OWN).find(k=>OWN[k]===uid),ro=()=>!!(DB&&S.level&&OWN[S.level]!==uid&&(OWN[S.level]||myLevel())),stat=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const save=()=>{if(S.level&&!ro())ALL[S.level]=S;try{localStorage.setItem(KEY,JSON.stringify({S,all:ALL}))}catch(e){}
 if(DB&&S.level&&!ro()){OWN[S.level]=uid;clearTimeout(timer);const obj=S,lv=obj.level;timer=setTimeout(()=>{DB.collection('levels').doc(lv).set({d:JSON.stringify(obj),owner:uid}).then(()=>stat('Synced ✓')).catch(()=>stat('Sync failed – will retry on your next change'))},700)}};
function setLevel(v){if(!v){render();return}
 const taken=OWN[v]&&uid&&OWN[v]!==uid;
 if(S.level)ALL[S.level]=S;
 if(taken||S.level){S=ALL[v]||blank();S.level=v}else S.level=v;
 cur=1;save();render()}
function _unusedSetLevel(v){if(!v){render();return}if(!S.level){S.level=v;save();render();return}ALL[S.level]=S;S=ALL[v]||blank();S.level=v;cur=1;save();render()}
function certs(r,rl){const c=r.filter(x=>x.ap>10).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="card"><h2>🎓 Certificate of Participation · ${rl}</h2>${c.length?c.map(x=>`<div class="stu"><span>${esc(x.name)}</span><span class="mu">${Number(x.ap.toFixed(1))} attendance points</span></div>`).join(''):'<span class="mu">No student has more than 10 attendance points yet.</span>'}<div class="mu" style="margin-top:6px">Students whose total attendance points earned is more than 10.</div></div>`}
function awards(r,D,rl){const lt=Object.values(D.lessons).filter(l=>Object.values(l.sc).some(x=>x.att!==''&&x.att!=null)).length;
 const best=k=>{const m=Math.max(0,...r.map(x=>x[k]??0));return m>0?r.filter(x=>(x[k]??0)===m):[]};
 const A=[['🎤','Best in Recitation',best('rec'),'rec'],['🎲','Game Champion',best('gam'),'gam'],['📖','Memory Verse Wizard',best('mem'),'mem'],['✅','Perfect Attendance',lt?r.filter(x=>x.att===100&&x.ac===lt):[],'att']];
 return `<div class="card"><h2>🏅 Awards · ${rl}</h2>${A.map(([i,t,w,k])=>`<div class="stu"><span>${i} <b>${t}</b></span><span style="text-align:right">${w.length?w.map(x=>esc(x.name)+(k==='att'?'':' ('+x[k].toFixed(0)+'%)')).join(', '):'<span class=mu>—</span>'}</span></div>`).join('')}<div class="mu" style="margin-top:6px">Tied students share the award.</div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=n=>S.lessons[n]||(S.lessons[n]={title:'',act:10,sc:{}});
function go(t){tab=t;render()}
function set(k,v){S[k]=v;save()}
function addStu(){const a=document.getElementById('fn'),b=document.getElementById('ln'),f=a.value.trim(),l=b.value.trim();
 a.classList.toggle('bad',!f);b.classList.toggle('bad',!l);
 if(!f||!l){document.getElementById('err').textContent='Both first name and last name are required.';(f?b:a).focus();return}
 const id=S.nid++;S.students.push({id,name:f+' '+l});save();render();openWiz(id)}
function twoStep(b,fn,label){if(b.dataset.armed){fn();return}
 b.dataset.armed=1;const t=b.textContent;b.textContent=label;b.style.background='var(--bad)';b.style.color='#fff';
 setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t;b.style.background='';b.style.color=''}},3500)}
function delStu(id,b){twoStep(b,()=>{S.students=S.students.filter(s=>s.id!==id);Object.values(S.lessons).forEach(l=>{delete l.sc[id]});save();render()},'Tap again to remove')}
function resetAll(b){twoStep(b,()=>{const ml=myLevel();S=blank();ALL={};cur=1;if(DB&&ml){OWN={};DB.collection('levels').doc(ml).delete().catch(()=>{})}try{localStorage.removeItem(KEY)}catch(e){}render()},'Tap again to erase all')}
function setN(v){S.n=Math.max(1,Math.min(60,+v||1));if(cur>S.n)cur=S.n;save()}
function setLesson(f,v){const l=L(cur);l[f]=f==='act'?Math.max(0,+v||0):v;save()}
function setSc(id,c,el){const l=L(cur),max=c==='act'?l.act:10;let v=el.value;
 if(v!==''){v=Math.max(0,+v);el.classList.toggle('bad',v>max)}else el.classList.remove('bad');
