function guideHTML(){const k=GLANG;
 return `<div class="card"><h2>${k?'Paano gamitin':'How to use'}</h2><div class="row seg"><button class="${k?'':'on'}" onclick="setLang(0)">English</button><button class="${k?'on':''}" onclick="setLang(1)">Filipino</button></div></div>`
 +GS.map(s=>`<div class="card"><h2>${s.t[k]}</h2>${s.r.map(([e,l])=>`<div class="mk"><div>${e}</div><div class="ar">⬅ ${l[k]}</div></div>`).join('')}</div>`).join('')
 +`<div class="card" style="border-color:var(--bad)"><h2>🚫 ${k?'Mga HINDI dapat gawin':'Things NOT to do'}</h2>${GD.map(d=>`<div class="stu" style="align-items:flex-start"><span>❌ ${d[k]}</span></div>`).join('')}</div>`}
function mkBackup(){const t='GTBACKUP1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))),a=document.getElementById('bk');
 a.value=t;a.style.display='block';a.focus();a.select();try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}
 document.getElementById('bmsg').textContent='Backup ready. If it did not copy, press and hold the box, choose Select All, then Copy. Paste it into Notes or send it to yourself in Messenger.'}
function doRestore(btn){const raw=document.getElementById('rs').value.trim(),m=document.getElementById('bmsg');
 if(!raw.startsWith('GTBACKUP1:')){m.textContent='That does not look like a backup. Paste the whole text that starts with GTBACKUP1:';return}
 let p;try{p=JSON.parse(decodeURIComponent(escape(atob(raw.slice(10).replace(/\s/g,'')))));if(!Array.isArray(p.students)||!p.lessons)throw 0}catch(e){m.textContent='The backup text is incomplete or damaged. Please copy it again.';return}
 twoStep(btn,()=>{if(S.level)ALL[S.level]=S;S=Object.assign(blank(),p);cur=1;if(S.level)ALL[S.level]=S;save();render();toast('Backup restored')},'Tap again to replace current data')}
function nav(){document.getElementById('nav').innerHTML=[['setup','Setup'],['scores','Scores'],['results','Results'],['guide','Guide']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}
function render(){nav();const v=document.getElementById('v');
 if(tab==='setup')v.innerHTML=`<div class="card"><h2>Class details</h2>
 <label>Level</label><select data-keep onchange="setLevel(this.value)"><option value="">Choose level…</option>${['Beginner','Primary','Intermediate'].map(x=>`<option value="${x}" ${S.level===x?'selected':''}>${x}${OWN[x]&&OWN[x]!==uid?' (other teacher)':''}</option>`).join('')}</select>
 <label>Teacher name</label><input value="${esc(S.teacher)}" oninput="set('teacher',this.value)" placeholder="Teacher’s full name">
 <label>Curriculum title</label><input value="${esc(S.curr)}" oninput="set('curr',this.value)" placeholder="e.g. Heroes of Faith">
 <label>Number of lessons in this curriculum</label><input type="number" min="1" max="60" value="${S.n}" oninput="setN(this.value)"></div>
 <div class="card"><h2>Students (${S.students.length})</h2><div class="row"><div><label style="margin-top:0">First name *</label><input id="fn" required placeholder="First name" onkeydown="if(event.key==='Enter')addStu()"></div><div><label style="margin-top:0">Last name *</label><input id="ln" required placeholder="Last name" onkeydown="if(event.key==='Enter')addStu()"></div></div><div id="err" class="mu" style="color:var(--bad);margin:6px 0"></div><button class="btn" style="width:100%" onclick="addStu()">Add student</button>
 ${S.students.map(s=>`<div class="stu"><span>${esc(s.name)}</span><div style="display:flex;gap:6px"><button class="btn" onclick="openWiz(${s.id})">Scores</button><button class="btn ghost" onclick="delStu(${s.id},this)">Remove</button></div></div>`).join('')}</div>
 <div class="card"><h2>Weights</h2><div class="mu">${C.map(c=>c[1]+' '+c[2]*100+'%').join(' · ')}</div></div>
 <div class="card"><h2>Backup / Restore</h2><div class="mu">Save a copy of your data in case it gets lost.</div><button class="btn" style="width:100%;margin-top:8px" onclick="mkBackup()">Create backup</button><textarea id="bk" readonly style="display:none;margin-top:8px"></textarea><label>Paste a backup here to restore</label><textarea id="rs" placeholder="GTBACKUP1:…"></textarea><button class="btn ghost" style="width:100%;margin-top:8px" onclick="doRestore(this)">Restore backup</button><div id="bmsg" class="mu" style="margin-top:6px"></div></div>
 <button class="btn ghost" style="width:100%" onclick="resetAll(this)">Reset all data</button>`;
 else if(tab==='scores'){const l=L(cur);
  v.innerHTML=`<div class="card"><label style="margin-top:0">Lesson number (of ${S.n})</label><select onchange="cur=+this.value;render()">${Array.from({length:S.n},(_,i)=>`<option value="${i+1}" ${cur===i+1?'selected':''}>Lesson ${i+1}</option>`).join('')}</select>
  <label>Curriculum</label><div>${esc(S.curr)||'<span class=mu>Set it in Setup</span>'}</div>
  <label>Lesson title</label><input value="${esc(l.title)}" oninput="setLesson('title',this.value)" placeholder="Lesson title">
  <label>Total points for Activity this lesson</label><input type="number" min="1" value="${l.act}" onchange="setLesson('act',this.value);render()">
  <div class="mu" style="margin-top:6px">Attendance, Games, Memory Verse and Recitation are each out of 10.</div></div>
  ${S.students.length?S.students.map(s=>{const x=l.sc[s.id]||{};return`<div class="card"><b>${esc(s.name)}</b><div class="g5">${C.map(([k,n])=>`<div><label>${n.split(' ')[0]} /${k==='act'?l.act:10}</label><input type="number" inputmode="decimal" min="0" value="${x[k]??''}" oninput="setSc(${s.id},'${k}',this)"></div>`).join('')}</div></div>`}).join(''):'<div class="card mu">Add students in Setup first.</div>'}`}
 else{const rl=RL||S.level||'Beginner',D=rl===S.level?S:(ALL[rl]||blank()),r=D.students.map(s=>calc(s,D)).sort((a,b)=>b.grade-a.grade);let rk=0,pv=null;r.forEach((x,i)=>{if(x.grade!==pv){rk=i+1;pv=x.grade}x.rank=rk});
  const f=n=>n==null?'–':n.toFixed(1);
  v.innerHTML=`<button class="btn" style="width:100%;margin-bottom:12px" onclick="dlPdf()">📄 Download PDF report (all levels)</button><button class="btn" style="width:100%;margin-bottom:12px" onclick="shotView()">📸 View report as image (for screenshot)</button><div id="pmsg" class="mu" style="color:var(--bad);margin:-6px 0 8px"></div><div class="card"><label style="margin-top:0">Viewing level</label><select onchange="RL=this.value;render()">${LV.map(x=>`<option ${x===rl?'selected':''}>${x}</option>`).join('')}</select></div><div class="card"><h2>🏆 Top 3 · ${rl}</h2>${r.length?`<div class="pod">${r.slice(0,3).map((x,i)=>`<div><small>${['🥇','🥈','🥉'][i]} #${x.rank}</small><b>${f(x.grade)}%</b>${esc(x.name)}</div>`).join('')}</div>`:'<span class=mu>No students yet.</span>'}
  <div class="mu" style="margin-top:8px">${esc(D.curr)} ${D.teacher?'· Teacher '+esc(D.teacher):''}</div></div>${awards(r,D,rl)}${certs(r,rl)}
  <div class="card"><h2>All grades</h2><div class="wrap"><table><tr><th>#</th><th>Student</th>${C.map(c=>`<th>${c[1].replace('Memory Verse','Mem.')}</th>`).join('')}<th>Grade</th></tr>
  ${r.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td>${C.map(c=>`<td>${f(x[c[0]])}</td>`).join('')}<td><b>${f(x.grade)}</b></td></tr>`).join('')}</table></div>
  <div class="mu" style="margin-top:8px">Category scores are % across all lessons with entered scores; Grade applies the weights.</div></div>`}}
const R0=render;render=function(){if(tab==='guide'){nav();document.getElementById('v').innerHTML=guideHTML();return}R0();if(ro()&&tab!=='results'){const v=document.getElementById('v');v.querySelectorAll('input,button,select:not([data-keep])').forEach(e=>e.disabled=true);v.insertAdjacentHTML('afterbegin','<div class="card" style="border-color:var(--bad)">👀 View only. Each level has one teacher, and this level isn’t yours.</div>')}};
render();
(async()=>{try{if(!window.claude)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;uid=await u.id();if(!uid)return;DB=d;let first=true;
 DB.collection('levels').onSnapshot(snap=>{OWN={};
  snap.docs.forEach(x=>{const v=x.data()||{};OWN[x.id]=v.owner;try{const r=JSON.parse(v.d);if(x.id===S.level&&v.owner===uid)return;ALL[x.id]=r;if(x.id===S.level||(!S.level&&v.owner===uid)){S=r;S.level=x.id}}catch(e){}});
  LV.forEach(l=>{if(!OWN[l]&&l!==S.level)delete ALL[l]});
  if(first){first=false;if(S.level&&!ro()&&OWN[S.level]!==uid)save()}
  stat('Synced ✓ shared across phones');
  if(!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&!W)render()},
  ()=>stat('Sync unavailable – saving on this phone only'))}catch(e){}})();
</script></body></html>
